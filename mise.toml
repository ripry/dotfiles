# Sources are absolute because a relative one resolves against config_root,
# which moves once this file is symlinked in as ~/.config/mise/config.toml.

[settings]
minimum_release_age = "1d"

[tools]
bat = "latest"
bottom = "latest"
delta = "latest"
dust = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
"github:herdrdev/herdr" = "latest"
jq = "latest"
neovim = "latest"
node = "lts"
pnpm = "latest"
python = "latest"
ripgrep = "latest"
sheldon = "latest"
starship = "latest"
uv = "latest"

[dotfiles]
"~/.zshenv" = "~/dotfiles/cli/zshenv"
"~/.miserc.toml" = "~/dotfiles/.miserc.toml"
"~/.config/mise/config.toml" = "~/dotfiles/mise.toml"
"~/.config/zsh" = { source = "~/dotfiles/cli/zsh", mode = "symlink-each" }
"~/.config/sheldon/plugins.toml" = "~/dotfiles/cli/sheldon/plugins.toml"
"~/.config/git" = { source = "~/dotfiles/cli/git", mode = "symlink-each" }
